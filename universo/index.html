<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escala del universo · ISSASODA</title>
    <meta name="description" content="Un viaje por todos los objetos del universo, desde el universo observable hasta la longitud de Planck, cada uno a su tamaño real en potencias de diez.">
    <link rel="canonical" href="https://issasodaweb.com/universo/">
    <link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="16x16 32x32 48x48 64x64 96x96">
    <link rel="manifest" href="../manifiesto.json">
    <meta name="theme-color" content="#0D0F14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="../comun/estilo.js"></script>
    <script src="../comun/astros.js"></script>
    <style>
        :root {
            --panel: rgba(10, 12, 18, 0.8);
            --text: #E9ECF1;
            --muted: #9AA3B2;
            --accent: #FFC857;
            --font-brand: 'Arial', sans-serif;
            --font-text: 'Arial', sans-serif;
            --font-title: 'Arial', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0D0F14;
            color: var(--text);
            font-family: var(--font-text);
        }

        a {
            color: var(--accent);
        }

        button, input {
            font: inherit;
            color: inherit;
        }

        #escala {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

            #escala:active {
                cursor: grabbing;
            }

        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 14px 24px;
            background: linear-gradient(to bottom, rgba(5, 6, 8, 0.85), rgba(5, 6, 8, 0));
        }

        .brand {
            font-family: var(--font-brand);
            font-size: 20px;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
        }

        .site-nav ul {
            display: flex;
            gap: 18px;
            margin: 0;
            padding: 0;
            list-style: none;
            overflow-x: auto;
            scrollbar-width: none;
        }

            .site-nav ul a {
                font-size: 13px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                text-decoration: none;
                white-space: nowrap;
            }

                .site-nav ul a:hover,
                .site-nav ul a[aria-current="page"] {
                    color: var(--text);
                }

        /* Ficha del objeto en foco */
        .card {
            position: fixed;
            z-index: 5;
            left: 24px;
            bottom: 96px;
            width: min(400px, calc(100vw - 48px));
            padding: 18px 22px;
            border-left: 3px solid var(--accent);
            border-radius: 14px;
            background: var(--panel);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            line-height: 1.5;
        }

            .card .eyebrow {
                margin: 0 0 4px;
                font-size: 12px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--accent);
            }

            .card h1 {
                margin: 0 0 8px;
                font-family: var(--font-title);
                font-weight: normal;
                font-size: clamp(22px, 3vw, 30px);
                line-height: 1.15;
            }

            .card .size {
                margin: 0;
                font-size: 16px;
            }

            .card .sci {
                margin: 0 0 6px;
                color: var(--muted);
                font-size: 13px;
            }

            .card .note {
                margin: 6px 0 0;
                color: var(--muted);
                font-size: 13px;
            }

            .card .pending {
                margin: 8px 0 0;
                font-size: 12px;
                color: var(--muted);
            }

        /* Controles */
        .controls {
            position: fixed;
            z-index: 6;
            left: 24px;
            right: 24px;
            bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

            .controls button {
                padding: 8px 14px;
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 999px;
                background: var(--panel);
                cursor: pointer;
                white-space: nowrap;
            }

                .controls button:hover,
                .controls button:focus-visible,
                .controls button[aria-pressed="true"] {
                    border-color: var(--accent);
                    color: var(--accent);
                }

            .controls input {
                flex: 1 1 200px;
                max-width: 320px;
                padding: 8px 14px;
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 999px;
                background: var(--panel);
            }

        .count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
        }

        /* Regla y eje de escalas */
        .ruler {
            position: fixed;
            z-index: 5;
            right: 156px;
            bottom: 70px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            pointer-events: none;
        }

            .ruler .bar {
                height: 6px;
                margin: 0 auto 4px;
                border: 1px solid var(--text);
                border-top: none;
            }

        #track {
            position: fixed;
            z-index: 5;
            top: 80px;
            right: 8px;
            width: 140px;
            height: calc(100vh - 170px);
            cursor: pointer;
        }

            #track text {
                fill: var(--muted);
                font-size: 10px;
                font-family: var(--font-text);
            }

            #track .tick line,
            #track .domain {
                stroke: rgba(255, 255, 255, 0.25);
            }

        dialog {
            width: min(720px, calc(100vw - 32px));
            max-height: 80vh;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            background: #10131A;
            color: var(--text);
        }

            dialog::backdrop {
                background: rgba(0, 0, 0, 0.6);
            }

            dialog header {
                position: sticky;
                top: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                background: #10131A;
                border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            }

                dialog header h2 {
                    margin: 0;
                    font-family: var(--font-title);
                    font-weight: normal;
                }

                dialog header button {
                    padding: 6px 12px;
                    border: 1px solid rgba(255, 255, 255, 0.25);
                    border-radius: 999px;
                    background: none;
                    cursor: pointer;
                }

            dialog .body {
                padding: 8px 20px 20px;
            }

            dialog h3 {
                margin: 18px 0 6px;
                font-size: 14px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            dialog ul {
                margin: 0;
                padding: 0;
                list-style: none;
                columns: 2 240px;
            }

            dialog li button {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                width: 100%;
                padding: 4px 6px;
                border: none;
                border-radius: 6px;
                background: none;
                text-align: left;
                cursor: pointer;
            }

                dialog li button:hover,
                dialog li button:focus-visible {
                    background: rgba(255, 255, 255, 0.08);
                }

                dialog li button span {
                    color: var(--muted);
                    font-size: 12px;
                    white-space: nowrap;
                }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        @media (max-width: 799px) {
            .site-nav {
                padding: 12px 16px;
                gap: 14px;
            }

            #track,
            .ruler {
                display: none;
            }

            .card {
                left: 16px;
                right: 16px;
                width: auto;
                bottom: auto;
                top: 56px;
                padding: 12px 16px;
            }

                .card .pending {
                    display: none;
                }

            .controls {
                left: 16px;
                right: 16px;
                bottom: 14px;
            }

                .controls input {
                    max-width: none;
                    order: -1;
                    flex-basis: 100%;
                }

            .count {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav" aria-label="Secciones">
        <a class="brand" href="../">ISSASODA</a>
        <ul>
            <li><a href="../#inicio">Universo</a></li>
            <li><a href="./" aria-current="page">Escala</a></li>
            <li><a href="../acerca/">Acerca de</a></li>
        </ul>
    </nav>

    <canvas id="escala" aria-label="Escala del universo: usa la búsqueda, la lista o las flechas del teclado"></canvas>
    <svg id="track" aria-hidden="true"></svg>

    <section class="card" id="card" aria-live="polite">
        <p class="eyebrow" id="card-type"></p>
        <h1 id="card-name">Escala del universo</h1>
        <p class="size" id="card-size"></p>
        <p class="sci" id="card-sci"></p>
        <p class="note" id="card-note" hidden></p>
        <p class="pending">Ficha propia de este objeto: pendiente.</p>
    </section>

    <div class="ruler" aria-hidden="true"><div class="bar" id="ruler-bar"></div><span id="ruler-label"></span></div>

    <div class="controls">
        <label class="visually-hidden" for="buscar">Buscar un objeto</label>
        <input id="buscar" type="search" list="nombres" placeholder="Buscar: galaxia, quark, Luna…" autocomplete="off">
        <datalist id="nombres"></datalist>
        <button id="mayor" title="Al universo (Inicio)">⇡ Universo</button>
        <button id="anterior" title="Objeto más grande (←)">◀</button>
        <button id="siguiente" title="Objeto más pequeño (→)">▶</button>
        <button id="menor" title="A la longitud de Planck (Fin)">Planck ⇣</button>
        <button id="viaje" aria-pressed="false" title="Viaje automático (espacio)">▶ Viaje</button>
        <button id="ver-lista">Lista</button>
        <span class="count" id="count"></span>
    </div>

    <dialog id="lista" aria-labelledby="lista-titulo">
        <header>
            <h2 id="lista-titulo">Todos los objetos</h2>
            <button id="cerrar-lista">Cerrar</button>
        </header>
        <div class="body" id="lista-cuerpo"></div>
    </dialog>

    <script>
        (async function () {
            'use strict';

            const params = new URLSearchParams(location.search);
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches && !params.has('motion');
            const FOCUS = 0.4;          // el objeto en foco ocupa 10^-0.4 ≈ 40 % del ancho
            const TOP = 27.6;
            const BOTTOM = -34.4;

            // Reinos de tamaño: agrupan la lista y el eje de la derecha
            const REALMS = [
                [22, 28, 'Cosmos'], [19, 22, 'Galaxias'], [14.5, 19, 'Nebulosas'], [10, 14.5, 'Sistemas estelares'],
                [7.5, 10, 'Estrellas'], [5.5, 7.5, 'Planetas'], [1, 5.5, 'Montañas y asteroides'], [-5, 1, 'Rocas y granos'],
                [-8.5, -5, 'Microscópico'], [-11, -8.5, 'Moléculas y átomos'], [-16.5, -11, 'Núcleos'],
                [-19, -16.5, 'Partículas'], [-33, -19, 'Lo desconocido'], [-36, -33, 'Planck']
            ];
            const TYPE_LABEL = {
                'cosmos': 'Estructura cósmica', 'vacio': 'Vacío cósmico', 'cumulo-galaxias': 'Agrupación de galaxias',
                'galaxia': 'Galaxia', 'parte-galaxia': 'Parte de una galaxia', 'corriente': 'Corriente de estrellas',
                'nube': 'Nube o nebulosa', 'nebulosa-planetaria': 'Nebulosa', 'remanente-sn': 'Restos de una explosión',
                'burbuja': 'Burbuja interestelar', 'cumulo': 'Cúmulo de estrellas', 'sistema': 'Sistema', 'disco': 'Disco',
                'estrella': 'Estrella', 'compacta': 'Estrella compacta', 'agujero': 'Agujero negro', 'chorro': 'Chorro',
                'planeta': 'Planeta', 'luna': 'Luna', 'anillo': 'Anillo', 'roca': 'Roca espacial', 'cometa': 'Cometa',
                'helado': 'Cuerpo helado', 'relieve': 'Paisaje planetario', 'atmosfera': 'Atmósfera',
                'interior-estelar': 'Capa de una estrella', 'interior-planetario': 'Capa de un planeta', 'material': 'Material',
                'gas': 'Estado de la materia', 'campo': 'Campo', 'onda': 'Onda', 'flujo': 'Flujo de partículas',
                'actividad': 'Actividad estelar', 'evento': 'Explosión', 'pilar': 'Pilar de gas y polvo', 'choque': 'Onda de choque',
                'filamento': 'Filamento', 'materia-oscura': 'Materia oscura', 'particula': 'Partícula elemental',
                'hadron': 'Partícula compuesta', 'nucleo': 'Núcleo atómico', 'atomo': 'Átomo', 'molecula': 'Molécula',
                'agregado': 'Agregado de moléculas', 'cuasiparticula': 'Cuasipartícula', 'cuantico': 'Fenómeno cuántico'
            };
            const NOTES = {
                rep: 'No tiene un tamaño único: se muestra en un orden de magnitud típico.',
                pt: 'Es puntual: no tiene tamaño medido, se muestra en el límite experimental (unos 10⁻¹⁸ m).',
                hip: 'Hipotético: todavía no se ha observado.'
            };

            // ---------- Estilo de la visita ----------
            const PANEL = '#0D0F14';
            const look = IssaEstilo.fonts(7);
            const stack = IssaEstilo.stack;
            document.documentElement.style.setProperty('--font-brand', stack(look.display[0]));
            document.documentElement.style.setProperty('--font-text', stack(look.text));
            const realmFont = i => look.display[1 + i % 6];

            // ---------- Datos ----------
            const objects = await d3.json('objetos.json');
            const slug = IssaEstilo.slug;
            objects.forEach((o, i) => {
                o.order = i;
                o.slug = slug(o.n);
                o.realm = REALMS.findIndex(r => o.s >= r[0] && o.s < r[1]);
                o.q = o.q || [];
            });
            const sorted = objects.slice().sort((a, b) => a.s - b.s || a.order - b.order);
            const bySlug = new Map(objects.map(o => [o.slug, o]));

            // Posiciones reales en metros: de menor a mayor, uno junto a otro; los de igual tamaño, en rejilla
            const groups = d3.groups(sorted, o => o.s);
            let cursor = 0;
            const spine = [];
            groups.forEach(([s, members], gi) => {
                const size = Math.pow(10, s);
                const cols = Math.ceil(Math.sqrt(members.length * 1.8));
                const rows = Math.ceil(members.length / cols);
                const cell = size * 1.6;
                if (gi) cursor += cell * 0.8 + Math.pow(10, groups[gi - 1][0]) * 0.8;
                members.forEach((o, i) => {
                    const c = i % cols, row = Math.floor(i / cols);
                    o.x = cursor + (c + 0.5) * cell;
                    o.y = (row - (rows - 1) / 2) * cell * 1.25;
                });
                spine.push({ s: s + Math.log10(cols), x: cursor + cols * cell / 2 });
                cursor += cols * cell;
            });
            // Dos puntos de la columna con el mismo tamaño se funden en uno (si no, la cámara dividiría entre cero)
            spine.sort((a, b) => a.s - b.s);
            for (let i = spine.length - 1; i > 0; i--) {
                if (spine[i].s - spine[i - 1].s < 1e-6) {
                    spine[i - 1].x = (spine[i - 1].x + spine[i].x) / 2;
                    spine.splice(i, 1);
                }
            }
            sorted.forEach((o, k) => { o.rank = k; });

            // Centro de la cámara para una escala: se acerca al siguiente objeto en proporción a su tamaño real
            function cameraX(E) {
                const target = E - FOCUS;
                if (target <= spine[0].s) return spine[0].x;
                if (target >= spine[spine.length - 1].s) return spine[spine.length - 1].x;
                const i = d3.bisector(d => d.s).right(spine, target) - 1;
                const a = spine[i], b = spine[i + 1];
                const span = Math.pow(10, b.s) - Math.pow(10, a.s);
                const f = span > 0 ? (Math.pow(10, target) - Math.pow(10, a.s)) / span : 0;
                return a.x + (b.x - a.x) * Math.max(0, Math.min(1, f));
            }

            // ---------- Formatos (comun/estilo.js) ----------
            const human = IssaEstilo.size;
            const scientific = IssaEstilo.scientific;
            const pow10 = IssaEstilo.power;

            // ---------- Estado ----------
            const canvas = document.getElementById('escala');
            const ctx = canvas.getContext('2d');
            let width = 0, height = 0, dpr = 1;
            let E = TOP;              // log10 de los metros que caben en el ancho de la pantalla
            let pan = [0, 0];         // desplazamiento libre, en anchos de pantalla
            let time = 0;
            let selected = null;
            let focused = null;
            let visible = [];
            let flying = false;
            const flight = d3.select({});

            const background = d3.scaleLinear()
                .domain([27, 21, 17, 12, 8, 5, 0, -6, -10, -15, -18, -25, -35])
                .range(['#140A26', '#0B1030', '#1A0E2A', '#0B1426', '#151208', '#0A1A22', '#161616', '#0C1A12', '#0B1A2A', '#1E0B18', '#14081C', '#06040A', '#000000'])
                .interpolate(d3.interpolateLab)
                .clamp(true);

            // Estrellas que se alejan del centro al acercarse: sensación de viaje infinito
            const warp = d3.range(260).map(() => ({ a: Math.random() * Math.PI * 2, b: Math.random(), c: Math.random() }));

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                drawTrack();
            }

            function screenOf(o) {
                const unit = Math.pow(10, E);
                const camX = cameraX(E);
                return [
                    width / 2 + ((o.x - camX) / unit - pan[0]) * width,
                    height / 2 + (o.y / unit - pan[1]) * width,
                    0.5 * width * Math.pow(10, o.s - E)
                ];
            }

            // ---------- Dibujo ----------
            function draw() {
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = background(E);
                ctx.fillRect(0, 0, width, height);
                const frac = ((-E % 1) + 1) % 1;
                const maxR = Math.hypot(width, height) / 2;
                warp.forEach(s => {
                    const d = s.b * Math.pow(10, frac) / 10 * maxR * 1.2;
                    const life = Math.min(1, frac + s.b) * (1 - Math.max(0, (d / maxR) - 0.8));
                    ctx.globalAlpha = 0.5 * s.c * Math.max(0, life);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(width / 2 + Math.cos(s.a) * d, height / 2 + Math.sin(s.a) * d, 1.2, 1.2);
                });
                ctx.globalAlpha = 1;

                const maxDim = Math.max(width, height);
                visible = [];
                for (const o of sorted) {
                    const [x, y, r] = screenOf(o);
                    if (r < 0.4 || r > maxDim * 3) continue;
                    if (x + r < -40 || x - r > width + 40 || y + r < -40 || y - r > height + 40) continue;
                    visible.push({ o: o, x: x, y: y, r: r });
                }
                visible.sort((a, b) => b.r - a.r);
                visible.forEach(v => {
                    const fadeIn = Math.min(1, (v.r - 0.4) / 3);
                    const fadeOut = Math.min(1, (maxDim * 3 - v.r) / (maxDim * 1.5));
                    ctx.globalAlpha = Math.max(0, Math.min(fadeIn, fadeOut));
                    IssaAstros.draw(ctx, v.o, v.x, v.y, v.r, time);
                });
                ctx.globalAlpha = 1;
                drawLabels();
                updateFocus();
            }

            function drawLabels() {
                const boxes = [];
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 6;
                visible.filter(v => v.r >= 9 && v.r <= Math.min(width, height) * 0.9)
                    .sort((a, b) => (b.o === selected) - (a.o === selected) || b.r - a.r)
                    .forEach(v => {
                        const y = v.y + Math.min(v.r, height) + 10;
                        if (y > height - 30) return;
                        const size = v.o === selected ? 16 : 13;
                        ctx.font = `${size}px ${stack(realmFont(v.o.realm))}`;
                        const w = ctx.measureText(v.o.n).width;
                        const box = [v.x - w / 2 - 4, y - 2, v.x + w / 2 + 4, y + size + 4];
                        if (boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) return;
                        boxes.push(box);
                        ctx.fillStyle = v.o === selected ? '#FFFFFF' : 'rgba(233, 236, 241, 0.85)';
                        ctx.fillText(v.o.n, v.x, y);
                    });
                ctx.shadowBlur = 0;
            }

            // ---------- Ficha, regla y eje ----------
            const card = {
                el: document.getElementById('card'),
                type: document.getElementById('card-type'),
                name: document.getElementById('card-name'),
                size: document.getElementById('card-size'),
                sci: document.getElementById('card-sci'),
                note: document.getElementById('card-note')
            };

            function updateFocus() {
                let best = null;
                if (selected) {
                    const [x, y, r] = screenOf(selected);
                    if (r > width * 0.02 && r < width * 1.2 && x > 0 && x < width && y > 0 && y < height) best = selected;
                }
                if (!best) {
                    let bestD = Infinity;
                    visible.forEach(v => {
                        if (v.r < width * 0.01 || v.r > width * 1.2) return;
                        const d = Math.hypot(v.x - width / 2, v.y - height / 2) + Math.abs(Math.log10(v.r / (width * 0.2))) * width * 0.2;
                        if (d < bestD) { bestD = d; best = v.o; }
                    });
                }
                if (best !== focused) {
                    focused = best;
                    showCard(best);
                }
                updateRuler();
                updateTrack();
            }

            function showCard(o) {
                if (!o) {
                    card.type.textContent = REALMS[Math.max(0, REALMS.findIndex(r => E - FOCUS >= r[0] && E - FOCUS < r[1]))][2];
                    card.name.textContent = 'Espacio entre escalas';
                    card.size.textContent = 'Nada conocido de este tamaño: sigue viajando.';
                    card.sci.textContent = scientific(E - FOCUS);
                    card.note.hidden = true;
                    return;
                }
                const color = IssaEstilo.readableColor(d3.hsl(IssaAstros.color(o)).h || 40, PANEL);
                card.el.style.setProperty('--accent', color);
                card.el.style.setProperty('--font-title', stack(realmFont(o.realm)));
                card.type.textContent = (TYPE_LABEL[o.t] || o.t) + ' · ' + REALMS[o.realm][2];
                card.name.textContent = o.n;
                card.size.textContent = human(o.s);
                card.sci.textContent = scientific(o.s) + ' · objeto ' + (sorted.length - o.rank) + ' de ' + sorted.length;
                const notes = o.q.map(q => NOTES[q]).concat(o.nota || []).filter(Boolean);
                card.note.hidden = !notes.length;
                card.note.textContent = notes.join(' ');
            }

            const rulerBar = document.getElementById('ruler-bar');
            const rulerLabel = document.getElementById('ruler-label');
            function updateRuler() {
                const p = Math.floor(E - 0.6);
                const px = width * Math.pow(10, p - E);
                rulerBar.style.width = px + 'px';
                rulerLabel.textContent = human(p);
            }

            const track = d3.select('#track');
            let trackY = null;
            function drawTrack() {
                const h = track.node().clientHeight;
                trackY = d3.scaleLinear().domain([TOP, -36]).range([6, h - 6]);
                track.selectAll('*').remove();
                track.append('g')
                    .selectAll('rect')
                    .data(REALMS)
                    .join('rect')
                    .attr('x', 94)
                    .attr('width', 4)
                    .attr('y', d => trackY(Math.min(d[1], TOP)))
                    .attr('height', d => trackY(d[0]) - trackY(Math.min(d[1], TOP)))
                    .attr('fill', (d, i) => d3.interpolateRainbow(i / REALMS.length))
                    .attr('opacity', 0.7)
                    .append('title')
                    .text(d => d[2]);
                track.append('g')
                    .attr('transform', 'translate(100, 0)')
                    .call(d3.axisRight(trackY).tickValues(d3.range(25, -36, -10)).tickFormat(pow10).tickSize(4));
                track.append('g')
                    .selectAll('text')
                    .data(REALMS.filter((d, i) => i % 2 === 0))
                    .join('text')
                    .attr('x', 90)
                    .attr('y', d => trackY((Math.min(d[1], TOP) + d[0]) / 2))
                    .attr('text-anchor', 'end')
                    .attr('dominant-baseline', 'middle')
                    .text(d => d[2]);
                track.append('path').attr('class', 'marker').attr('fill', '#FFFFFF');
            }

            function updateTrack() {
                if (!trackY) return;
                const y = trackY(Math.max(-36, Math.min(TOP, E - FOCUS)));
                track.select('.marker').attr('d', `M${86},${y}L${96},${y - 5}L${96},${y + 5}Z`);
            }

            track.on('click', event => {
                const [, y] = d3.pointer(event);
                flyTo(trackY.invert(y) + FOCUS, [0, 0], null);
            });

            // ---------- Movimiento ----------
            function setScale(nextE) {
                const clamped = Math.max(BOTTOM, Math.min(TOP, nextE));
                const factor = Math.pow(0.5, Math.abs(clamped - E) / 0.5);
                pan = [pan[0] * factor, pan[1] * factor];
                E = clamped;
            }

            function stopFlight() {
                flight.interrupt();
                flying = false;
                setTour(false);
            }

            function flyTo(targetE, targetPan, object, duration) {
                flight.interrupt();
                const e0 = E, p0 = pan.slice();
                const ms = reduceMotion ? 0 : duration != null ? duration : Math.min(4500, 400 + Math.abs(targetE - e0) * 150);
                flying = true;
                selected = object;
                if (object) history.replaceState(null, '', '#' + object.slug);
                const iE = d3.interpolateNumber(e0, targetE);
                const iP = d3.interpolateArray(p0, targetPan);
                return flight.transition()
                    .duration(ms)
                    .ease(duration != null ? d3.easeLinear : d3.easeCubicInOut)
                    .tween('scale', () => t => {
                        E = iE(t);
                        pan = iP(t);
                        if (reduceMotion) draw();
                    })
                    .on('end', () => {
                        flying = false;
                        if (reduceMotion) draw();
                    });
            }

            function focusOn(o, duration) {
                const targetE = o.s + FOCUS;
                const unit = Math.pow(10, targetE);
                return flyTo(targetE, [(o.x - cameraX(targetE)) / unit, o.y / unit], o, duration);
            }

            function step(delta) {
                const from = focused || selected;
                const k = from ? from.rank : sorted.length - 1;
                const next = sorted[Math.max(0, Math.min(sorted.length - 1, k - delta))];
                focusOn(next);
            }

            // Viaje automático: del tamaño actual hasta la longitud de Planck
            const tourButton = document.getElementById('viaje');
            function setTour(on) {
                tourButton.setAttribute('aria-pressed', on ? 'true' : 'false');
                tourButton.textContent = on ? '❚❚ Pausa' : '▶ Viaje';
            }
            tourButton.addEventListener('click', () => {
                if (tourButton.getAttribute('aria-pressed') === 'true') {
                    stopFlight();
                    return;
                }
                if (E <= BOTTOM + 0.2) E = TOP;
                selected = null;
                setTour(true);
                flyTo(BOTTOM, [0, 0], null, (E - BOTTOM) * 2400).on('end.tour', () => setTour(false));
            });
            if (reduceMotion) tourButton.hidden = true;

            document.getElementById('mayor').addEventListener('click', () => focusOn(sorted[sorted.length - 1]));
            document.getElementById('menor').addEventListener('click', () => focusOn(sorted[0]));
            document.getElementById('anterior').addEventListener('click', () => step(-1));
            document.getElementById('siguiente').addEventListener('click', () => step(1));

            canvas.addEventListener('wheel', event => {
                event.preventDefault();
                stopFlight();
                selected = null;
                const delta = event.deltaMode === 1 ? event.deltaY * 33 : event.deltaY;
                setScale(E + delta * 0.0015);
                if (reduceMotion) draw();
            }, { passive: false });

            // Arrastrar para moverse; pellizcar para cambiar de escala
            const pointers = new Map();
            let pinch = null;
            canvas.addEventListener('pointerdown', event => {
                canvas.setPointerCapture(event.pointerId);
                pointers.set(event.pointerId, [event.clientX, event.clientY, event.clientX, event.clientY]);
                stopFlight();
            });
            canvas.addEventListener('pointermove', event => {
                const p = pointers.get(event.pointerId);
                if (!p) return;
                const prev = [p[0], p[1]];
                p[0] = event.clientX;
                p[1] = event.clientY;
                if (pointers.size === 2) {
                    const [a, b] = Array.from(pointers.values());
                    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
                    if (pinch) setScale(E - Math.log10(d / pinch));
                    pinch = d;
                } else if (pointers.size === 1) {
                    pan = [pan[0] - (p[0] - prev[0]) / width, pan[1] - (p[1] - prev[1]) / width];
                    if (Math.hypot(p[0] - p[2], p[1] - p[3]) > 6) selected = null;
                }
                if (reduceMotion) draw();
            });
            const release = event => {
                const p = pointers.get(event.pointerId);
                pointers.delete(event.pointerId);
                if (pointers.size < 2) pinch = null;
                // Un toque sin arrastrar elige el objeto más cercano (d3.Delaunay)
                if (p && Math.hypot(p[0] - p[2], p[1] - p[3]) < 6 && visible.length) {
                    const i = d3.Delaunay.from(visible, v => v.x, v => v.y).find(p[0], p[1]);
                    const v = visible[i];
                    if (Math.hypot(v.x - p[0], v.y - p[1]) < Math.max(v.r, 24)) focusOn(v.o);
                }
            };
            canvas.addEventListener('pointerup', release);
            canvas.addEventListener('pointercancel', release);

            document.addEventListener('keydown', event => {
                if (event.target.closest && event.target.closest('input, dialog')) return;
                const actions = {
                    ArrowLeft: () => step(-1), ArrowRight: () => step(1),
                    ArrowUp: () => { stopFlight(); setScale(E - 0.25); }, ArrowDown: () => { stopFlight(); setScale(E + 0.25); },
                    '+': () => { stopFlight(); setScale(E - 0.25); }, '-': () => { stopFlight(); setScale(E + 0.25); },
                    Home: () => focusOn(sorted[sorted.length - 1]), End: () => focusOn(sorted[0]),
                    ' ': () => tourButton.click()
                };
                const action = actions[event.key];
                if (!action) return;
                event.preventDefault();
                action();
                if (reduceMotion) draw();
            });

            // ---------- Búsqueda y lista ----------
            const search = document.getElementById('buscar');
            const datalist = document.getElementById('nombres');
            objects.forEach(o => {
                const option = document.createElement('option');
                option.value = o.n;
                datalist.appendChild(option);
            });
            function findByText(text) {
                const q = slug(text);
                if (!q) return null;
                return bySlug.get(q) || objects.find(o => o.slug.startsWith(q)) || objects.find(o => o.slug.includes(q));
            }
            search.addEventListener('change', () => {
                const o = findByText(search.value);
                if (o) {
                    focusOn(o);
                    search.blur();
                }
            });
            search.addEventListener('keydown', event => {
                if (event.key === 'Enter') search.dispatchEvent(new Event('change'));
            });

            const dialog = document.getElementById('lista');
            const listBody = d3.select('#lista-cuerpo');
            REALMS.forEach((realm, i) => {
                const members = sorted.filter(o => o.realm === i).reverse();
                if (!members.length) return;
                listBody.append('h3').style('color', IssaEstilo.readableColor(i / REALMS.length * 360, '#10131A')).text(`${realm[2]} (${members.length})`);
                listBody.append('ul')
                    .selectAll('li')
                    .data(members)
                    .join('li')
                    .append('button')
                    .on('click', (event, o) => {
                        dialog.close();
                        focusOn(o);
                    })
                    .call(b => b.append('b').style('font-weight', 'normal').text(o => o.n))
                    .call(b => b.append('span').text(o => human(o.s)));
            });
            document.getElementById('ver-lista').addEventListener('click', () => dialog.showModal());
            document.getElementById('cerrar-lista').addEventListener('click', () => dialog.close());
            document.getElementById('count').textContent = objects.length + ' objetos, de ' + pow10(27) + ' a ' + pow10(-35) + ' m';

            // ---------- Arranque ----------
            window.addEventListener('resize', () => {
                resize();
                if (reduceMotion) draw();
            });
            resize();
            const hash = decodeURIComponent(location.hash.slice(1));
            if (hash === 'lista') {
                dialog.showModal();
            }
            const start = bySlug.get(hash);
            if (start) {
                E = TOP;
                focusOn(start);
            } else {
                E = TOP;
                focusOn(sorted[sorted.length - 1], reduceMotion ? 0 : 1200);
            }
            if (reduceMotion) {
                draw();
            } else {
                let last = 0;
                d3.timer(elapsed => {
                    time += Math.min(0.05, (elapsed - last) / 1000);
                    last = elapsed;
                    draw();
                });
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('../ServiceWorker.js').catch(error => {
                    console.error('Fallo al registrar el Service Worker:', error);
                });
            }
        })();
    </script>
</body>
</html>
